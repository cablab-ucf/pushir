[package]
name = "pushir"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "A relay mailbox that hands on sealed bytes, unopened"
repository = "https://github.com/cablab-ucf/pushir"

[dependencies]
anyhow = "1"
aws-lc-rs = "1"
data-encoding = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
iroh-base = "1.4.1"
iroh-dns = "1.4.1"
iroh-relay = { version = "1.4.1", default-features = false, features = ["tls-aws-lc-rs"] }
jni = { version = "0.22", optional = true }
noq-proto = { version = "1.4", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
url = "2"

[features]
jni = ["dep:jni"] # android/pushir: on in the app's native library

[target.'cfg(not(target_os = "android"))'.dependencies]
iroh-relay = { version = "1.4.1", default-features = false, features = ["platform-verifier"] }

[dev-dependencies]
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-aws-lc-rs"] }

[profile.release]
lto = true
strip = true
