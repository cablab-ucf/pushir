name: CI
# Third-party actions pinned to commit SHAs; read-only token.
# Once per pull request (not again on merge), or by hand: minutes are scarce.
on:
  pull_request: { paths-ignore: ["**.md"] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  rust:
    runs-on: ubuntu-latest
    env: { CARGO_INCREMENTAL: 0, CARGO_PROFILE_DEV_DEBUG: line-tables-only }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { shared-key: test, save-if: "${{ github.ref == 'refs/heads/main' }}" } # saved by main alone (a release), read by all
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --features jni -- -D warnings
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with: { tool: cargo-audit@0.22.2 }
      - run: cargo audit
      - run: cargo audit -f deploy/iroh-relay.Cargo.lock # the relay's own lock


  android: # the Kotlin library compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with: { packages: platform-tools }
      - run: ./gradlew --no-daemon :pushir:assembleRelease
        working-directory: android
